<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img" aria-label="Tanlangan loyihalar">
<title>Tanlangan loyihalar</title>
<!-- ✏️ Matnlarni pastdagi <text> teglari ichida o‘zgartiring -->
<defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m,.fl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:11px;letter-spacing:4px;fill:#5f6f83;font-weight:600}
.bk{animation:b 1.1s steps(1) infinite}@keyframes b{50%{fill-opacity:0}}
.d1{animation:d 15s ease-in-out infinite}.d2{animation:d 19s ease-in-out infinite reverse}
@keyframes d{50%{transform:translate(34px,-16px)}}
.st{opacity:.5;animation:tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
.fl{opacity:.25;animation:fl 9s ease-in-out infinite both}
@keyframes fl{0%{opacity:0;transform:translateY(14px)}25%,60%{opacity:.38}100%{opacity:0;transform:translateY(-34px)}}
.ph{opacity:0;animation:cyc 12s ease-in-out infinite both}.first{opacity:1}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.sw{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-230px)}35%,100%{transform:translateX(900px)}}
.rs{animation:rs .7s ease-out both}
@keyframes rs{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{animation:pu 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.w1{animation:wv 9s linear infinite}.w2{animation:wv 13s linear infinite reverse}
@keyframes wv{to{transform:translateX(-380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<filter id="bl" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1160" height="852"><feGaussianBlur stdDeviation="44"/></filter>
<clipPath id="cp"><rect width="760" height="452" rx="18"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="r0"><rect x="28" y="72" width="704" height="62" rx="12"/></clipPath><clipPath id="r1"><rect x="28" y="146" width="704" height="62" rx="12"/></clipPath><clipPath id="r2"><rect x="28" y="220" width="704" height="62" rx="12"/></clipPath><clipPath id="r3"><rect x="28" y="294" width="704" height="62" rx="12"/></clipPath><clipPath id="r4"><rect x="28" y="368" width="704" height="62" rx="12"/></clipPath>
</defs>
<rect width="760" height="452" rx="18" fill="#070b12"/>
<g clip-path="url(#cp)"><g filter="url(#bl)">
  <circle class="d1" cx="700" cy="40" r="120" fill="#7c3aed" opacity="0.25"/>
  <circle class="d2" cx="60" cy="400" r="140" fill="#0d9488" opacity="0.25"/>
  <circle class="d1" cx="380" cy="220" r="110" fill="#2563eb" opacity="0.12"/>
</g></g>
<rect x=".5" y=".5" width="759" height="451" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<text x="380" y="48" text-anchor="middle" class="lbl">TANLANGAN LOYIHALAR</text>
<g class="rs" style="animation-delay:0.15s"><rect x="28" y="72" width="704" height="62" rx="12" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/><circle cx="52" cy="103" r="4" fill="#2dd4bf"/><text x="72" y="100" font-size="15" fill="#e5e7eb" font-weight="600">Onlayn do‘kon</text><text x="72" y="119" font-size="12" fill="#7b8798">Onlayn do‘kon veb-sahifasi — JavaScript bilan mashq</text><text x="712" y="108" font-size="11" fill="#2dd4bf" text-anchor="end" class="m" fill-opacity=".85">HTML · CSS · JavaScript</text><g clip-path="url(#r0)"><rect class="sw" x="28" y="72" width="110" height="62" fill="url(#sh)" style="animation-delay:1.00s"/></g></g>
<g class="rs" style="animation-delay:0.29s"><rect x="28" y="146" width="704" height="62" rx="12" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/><circle cx="52" cy="177" r="4" fill="#a78bfa"/><text x="72" y="174" font-size="15" fill="#e5e7eb" font-weight="600">Maktab sayti</text><text x="72" y="193" font-size="12" fill="#7b8798">Maktabim (sinfim) uchun o‘zim yaratgan to‘liq sahifa</text><text x="712" y="182" font-size="11" fill="#a78bfa" text-anchor="end" class="m" fill-opacity=".85">HTML · CSS · JavaScript</text><g clip-path="url(#r1)"><rect class="sw" x="28" y="146" width="110" height="62" fill="url(#sh)" style="animation-delay:1.90s"/></g></g>
<g class="rs" style="animation-delay:0.43s"><rect x="28" y="220" width="704" height="62" rx="12" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/><circle cx="52" cy="251" r="4" fill="#60a5fa"/><text x="72" y="248" font-size="15" fill="#e5e7eb" font-weight="600">Traveland turizm sayti</text><text x="72" y="267" font-size="12" fill="#7b8798">Turizm agentligi shabloni asosidagi o‘z saytim</text><text x="712" y="256" font-size="11" fill="#60a5fa" text-anchor="end" class="m" fill-opacity=".85">HTML · CSS · JavaScript</text><g clip-path="url(#r2)"><rect class="sw" x="28" y="220" width="110" height="62" fill="url(#sh)" style="animation-delay:2.80s"/></g></g>
<g class="rs" style="animation-delay:0.57s"><rect x="28" y="294" width="704" height="62" rx="12" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/><circle cx="52" cy="325" r="4" fill="#fbbf24"/><text x="72" y="322" font-size="15" fill="#e5e7eb" font-weight="600">Nexora shabloni</text><text x="72" y="341" font-size="12" fill="#7b8798">SaaS shablonini 1:1 qayta yasash — amaliyot</text><text x="712" y="330" font-size="11" fill="#fbbf24" text-anchor="end" class="m" fill-opacity=".85">HTML · CSS · Bootstrap</text><g clip-path="url(#r3)"><rect class="sw" x="28" y="294" width="110" height="62" fill="url(#sh)" style="animation-delay:3.70s"/></g></g>
<g class="rs" style="animation-delay:0.71s"><rect x="28" y="368" width="704" height="62" rx="12" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"/><circle cx="52" cy="399" r="4" fill="#f472b6"/><text x="72" y="396" font-size="15" fill="#e5e7eb" font-weight="600">Scratch o‘yini</text><text x="72" y="415" font-size="12" fill="#7b8798">Tushayotgan achkolarni yig‘ish o‘yini</text><text x="712" y="404" font-size="11" fill="#f472b6" text-anchor="end" class="m" fill-opacity=".85">Scratch</text><g clip-path="url(#r4)"><rect class="sw" x="28" y="368" width="110" height="62" fill="url(#sh)" style="animation-delay:4.60s"/></g></g>
</svg>
