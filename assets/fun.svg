<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img" aria-label="Hazil statistika">
<title>Hazil statistika</title>
<!-- ✏️ Matnlarni pastdagi <text> teglari ichida o‘zgartiring -->
<defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m,.fl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:11px;letter-spacing:4px;fill:#5f6f83;font-weight:600}
.bk{animation:b 1.1s steps(1) infinite}@keyframes b{50%{fill-opacity:0}}
.d1{animation:d 15s ease-in-out infinite}.d2{animation:d 19s ease-in-out infinite reverse}
@keyframes d{50%{transform:translate(34px,-16px)}}
.st{opacity:.5;animation:tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
.fl{opacity:.25;animation:fl 9s ease-in-out infinite both}
@keyframes fl{0%{opacity:0;transform:translateY(14px)}25%,60%{opacity:.38}100%{opacity:0;transform:translateY(-34px)}}
.ph{opacity:0;animation:cyc 12s ease-in-out infinite both}.first{opacity:1}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.sw{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-230px)}35%,100%{transform:translateX(900px)}}
.rs{animation:rs .7s ease-out both}
@keyframes rs{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{animation:pu 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.w1{animation:wv 9s linear infinite}.w2{animation:wv 13s linear infinite reverse}
@keyframes wv{to{transform:translateX(-380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<filter id="bl" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1160" height="662"><feGaussianBlur stdDeviation="44"/></filter>
<clipPath id="cp"><rect width="760" height="262" rx="18"/></clipPath>

</defs>
<rect width="760" height="262" rx="18" fill="#070b12"/>
<g clip-path="url(#cp)"><g filter="url(#bl)">
  <circle class="d1" cx="80" cy="240" r="110" fill="#7c3aed" opacity="0.3"/>
  <circle class="d2" cx="700" cy="40" r="100" fill="#0d9488" opacity="0.25"/>
</g></g>
<rect x=".5" y=".5" width="759" height="261" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<text x="380" y="46" text-anchor="middle" class="lbl">HAZIL STATISTIKA</text>
<text x="380" y="68" font-size="11.5" fill="#64748b" text-anchor="middle">(hazil — jiddiy emas :)</text>
<text x="44" y="108" font-size="14" fill="#cbd5e1">Choy ichish</text>
<rect x="230" y="96" width="360" height="12" rx="6" fill="#fff" fill-opacity=".07"/>
<rect class="gr" x="230" y="96" width="360" height="12" rx="6" fill="#fbbf24" fill-opacity=".9" style="animation-delay:0.30s"/>
<text x="608" y="107" font-size="12" fill="#fbbf24" class="m">∞ piyola</text>
<text x="44" y="152" font-size="14" fill="#cbd5e1">‘Nega ishlamayapti?’</text>
<rect x="230" y="140" width="360" height="12" rx="6" fill="#fff" fill-opacity=".07"/>
<rect class="gr" x="230" y="140" width="346" height="12" rx="6" fill="#f472b6" fill-opacity=".9" style="animation-delay:0.55s"/>
<text x="608" y="151" font-size="12" fill="#f472b6" class="m">deyarli doim</text>
<text x="44" y="196" font-size="14" fill="#cbd5e1">Kod yozish</text>
<rect x="230" y="184" width="360" height="12" rx="6" fill="#fff" fill-opacity=".07"/>
<rect class="gr" x="230" y="184" width="288" height="12" rx="6" fill="#2dd4bf" fill-opacity=".9" style="animation-delay:0.80s"/>
<text x="608" y="195" font-size="12" fill="#2dd4bf" class="m">tobora ko‘proq</text>
<text x="44" y="240" font-size="14" fill="#cbd5e1">Uxlash</text>
<rect x="230" y="228" width="360" height="12" rx="6" fill="#fff" fill-opacity=".07"/>
<rect class="gr" x="230" y="228" width="90" height="12" rx="6" fill="#818cf8" fill-opacity=".9" style="animation-delay:1.05s"/>
<text x="608" y="239" font-size="12" fill="#818cf8" class="m">keyinroq</text>
</svg>
