<text x="566" y="180" font-size="11.5" fill="#64748b" text-anchor="middle">rejada</text>
<circle cx="690" cy="116" r="9" fill="#0b1020" stroke="#475569" stroke-width="2"/>
<text x="690" y="160" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">React</text>
<text x="690" y="180" font-size="11.5" fill="#64748b" text-anchor="middle">rejada</text>
<g class="bob"><rect x="266" y="62" width="104" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".45"/><path d="M313 86l5 6l5 -6z" fill="#a78bfa" fill-opacity=".45"/><text x="318" y="78" font-size="11.5" fill="#c4b5fd" text-anchor="middle">Hozir shu yerda</text></g>
