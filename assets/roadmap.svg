<path d="M189.5 116.5l3.2 3.2l6-6.4" stroke="#04121a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="194" y="160" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">CSS3</text>
<text x="194" y="180" font-size="11.5" fill="#5eead4" text-anchor="middle">o‘rganildi</text>
