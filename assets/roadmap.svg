<path class="dr" d="M70 116H318" stroke="url(#pg)" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="248"/>
<circle cx="70" cy="116" r="11" fill="#2dd4bf"/>
<path d="M65.5 116.5l3.2 3.2l6-6.4" stroke="#04121a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="160" font-size="14" fill="#e2e8f0" font-weight="600" text-anchor="middle">HTML5</text>
<text x="70" y="180" font-size="11.5" fill="#5eead4" text-anchor="middle">o‘rganildi</text>
