<svg xmlns="http://www.w3.org/2000/svg" width="760" height="110" viewBox="0 0 760 110" role="img" aria-label="Bu profil sahifasi muntazam yangilanadi">
<title>Bu profil sahifasi muntazam yangilanadi</title>
<!-- ✏️ Matnlarni pastdagi <text> teglari ichida o‘zgartiring -->
<defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m,.fl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:11px;letter-spacing:4px;fill:#5f6f83;font-weight:600}
.bk{animation:b 1.1s steps(1) infinite}@keyframes b{50%{fill-opacity:0}}
.d1{animation:d 15s ease-in-out infinite}.d2{animation:d 19s ease-in-out infinite reverse}
@keyframes d{50%{transform:translate(34px,-16px)}}
.st{opacity:.5;animation:tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
.fl{opacity:.25;animation:fl 9s ease-in-out infinite both}
@keyframes fl{0%{opacity:0;transform:translateY(14px)}25%,60%{opacity:.38}100%{opacity:0;transform:translateY(-34px)}}
.ph{opacity:0;animation:cyc 12s ease-in-out infinite both}.first{opacity:1}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.sw{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-230px)}35%,100%{transform:translateX(900px)}}
.rs{animation:rs .7s ease-out both}
@keyframes rs{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{animation:pu 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.w1{animation:wv 9s linear infinite}.w2{animation:wv 13s linear infinite reverse}
@keyframes wv{to{transform:translateX(-380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<filter id="bl" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1160" height="510"><feGaussianBlur stdDeviation="44"/></filter>
<clipPath id="cp"><rect width="760" height="110" rx="18"/></clipPath>
<linearGradient id="wg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<rect width="760" height="110" rx="18" fill="#070b12"/>
<g clip-path="url(#cp)"><g filter="url(#bl)">
  <circle class="d1" cx="380" cy="120" r="110" fill="#7c3aed" opacity="0.25"/>
</g></g>
<rect x=".5" y=".5" width="759" height="109" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<circle cx="364" cy="22" r="3.5" fill="#2dd4bf"/>
<circle cx="380" cy="22" r="3.5" fill="#a78bfa"/>
<circle cx="396" cy="22" r="3.5" fill="#f472b6"/>
<g class="w1"><path d="M-380 60q95 -18 190 0t190 0t190 0t190 0t190 0t190 0t190 0t190 0" fill="none" stroke="url(#wg)" stroke-width="2" stroke-opacity=".6"/></g>
<g class="w2"><path d="M-380 60q95 -18 190 0t190 0t190 0t190 0t190 0t190 0t190 0t190 0" transform="translate(0 8)" fill="none" stroke="url(#wg)" stroke-width="2" stroke-opacity=".28"/></g>
<text x="380" y="94" font-size="12" fill="#5f6f83" text-anchor="middle">Bu profil sahifasi muntazam yangilanadi<tspan class="bk"> _</tspan></text>
</svg>
