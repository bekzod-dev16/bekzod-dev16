<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" role="img" aria-label="Terminal: git add, commit, push">
<title>Terminal: git add, commit, push</title>
<!-- ✏️ Matnlarni pastdagi <text> teglari ichida o‘zgartiring -->
<defs>
<style>
text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.m,.fl{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.lbl{font-size:11px;letter-spacing:4px;fill:#5f6f83;font-weight:600}
.bk{animation:b 1.1s steps(1) infinite}@keyframes b{50%{fill-opacity:0}}
.d1{animation:d 15s ease-in-out infinite}.d2{animation:d 19s ease-in-out infinite reverse}
@keyframes d{50%{transform:translate(34px,-16px)}}
.st{opacity:.5;animation:tw 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
.fl{opacity:.25;animation:fl 9s ease-in-out infinite both}
@keyframes fl{0%{opacity:0;transform:translateY(14px)}25%,60%{opacity:.38}100%{opacity:0;transform:translateY(-34px)}}
.ph{opacity:0;animation:cyc 12s ease-in-out infinite both}.first{opacity:1}
@keyframes cyc{0%{opacity:0;transform:translateY(10px)}3%,22%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-10px)}}
.sw{animation:sw 6s ease-in-out infinite}
@keyframes sw{0%{transform:translateX(-230px)}35%,100%{transform:translateX(900px)}}
.rs{animation:rs .7s ease-out both}
@keyframes rs{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{animation:pu 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.w1{animation:wv 9s linear infinite}.w2{animation:wv 13s linear infinite reverse}
@keyframes wv{to{transform:translateX(-380px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tf{animation:tf 16s linear infinite}
@keyframes tf{0.00%,84.00%{opacity:1}90.00%,100.00%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cov{display:none}}
@keyframes tc0{0.00%,3.75%{transform:translateX(0);animation-timing-function:steps(9,end)}10.62%,100.00%{transform:translateX(87.0px)}}
@keyframes sc0{0.00%,10.62%{stroke-dashoffset:90}13.75%,100.00%{stroke-dashoffset:0}}
@keyframes ou0{0.00%,15.00%{opacity:0}17.50%,100.00%{opacity:1}}
@keyframes cu0{0.00%,3.44%{opacity:0}3.75%,12.50%{opacity:1}13.12%,100.00%{opacity:0}}
.tc0{animation:tc0 16s infinite}.sc0{animation:sc0 16s linear infinite}.ou0{animation:ou0 16s infinite}.cu0{animation:cu0 16s steps(1) infinite}
@keyframes tc1{0.00%,18.75%{transform:translateX(0);animation-timing-function:steps(28,end)}31.25%,100.00%{transform:translateX(258.0px)}}
@keyframes sc1{0.00%,31.25%{stroke-dashoffset:272}34.38%,100.00%{stroke-dashoffset:0}}
@keyframes ou1{0.00%,36.88%{opacity:0}39.38%,100.00%{opacity:1}}
@keyframes cu1{0.00%,18.44%{opacity:0}18.75%,33.12%{opacity:1}33.75%,100.00%{opacity:0}}
.tc1{animation:tc1 16s infinite}.sc1{animation:sc1 16s linear infinite}.ou1{animation:ou1 16s infinite}.cu1{animation:cu1 16s steps(1) infinite}
@keyframes tc2{0.00%,40.62%{transform:translateX(0);animation-timing-function:steps(20,end)}51.25%,100.00%{transform:translateX(186.0px)}}
@keyframes sc2{0.00%,51.25%{stroke-dashoffset:195}54.37%,100.00%{stroke-dashoffset:0}}
@keyframes ou2{0.00%,57.50%{opacity:0}60.00%,100.00%{opacity:1}}
@keyframes cu2{0.00%,40.31%{opacity:0}40.62%,53.12%{opacity:1}53.75%,100.00%{opacity:0}}
.tc2{animation:tc2 16s infinite}.sc2{animation:sc2 16s linear infinite}.ou2{animation:ou2 16s infinite}.cu2{animation:cu2 16s steps(1) infinite}
</style>
<filter id="bl" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1160" height="746"><feGaussianBlur stdDeviation="44"/></filter>
<clipPath id="cp"><rect width="760" height="346" rx="18"/></clipPath>

</defs>
<rect width="760" height="346" rx="18" fill="#070b12"/>

<rect x=".5" y=".5" width="759" height="345" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
<g clip-path="url(#cp)"><rect y="46" width="760" height="300" fill="#0a0d13"/><rect width="760" height="46" fill="#141a24"/><path d="M0 46H760" stroke="#fff" stroke-opacity=".07"/></g>
<circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
<text x="380" y="28" font-size="13" fill="#8b98a9" text-anchor="middle" class="m">bekzod@dev: ~/mening-saytim</text>
<g class="tf"><path class="sc0" d="M34.0 91.0L47.0 93.4L60.0 88.6L73.0 93.4L86.0 88.6L99.0 93.4L112.0 88.6L119.0 91.0" fill="none" stroke="#22c55e" stroke-opacity=".5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="90"/>
<text class="m" x="36" y="96" font-size="15" fill="#f1f5f9">git add .</text>
<rect class="tc0 cov" x="33" y="80" width="95.0" height="24" fill="#0a0d13"/>
<g class="tc0 cov"><rect class="cu0" x="36" y="82" width="8" height="18" fill="#22c55e" opacity=".9"/></g>
<text x="36" y="130" font-size="14" fill="#8b98a9" class="m ou0">Fayllar tayyor</text>
<path class="sc1" d="M34.0 165.0L47.0 167.4L60.0 162.6L73.0 167.4L86.0 162.6L99.0 167.4L112.0 162.6L125.0 167.4L138.0 162.6L151.0 167.4L164.0 162.6L177.0 167.4L190.0 162.6L203.0 167.4L216.0 162.6L229.0 167.4L242.0 162.6L255.0 167.4L268.0 162.6L281.0 167.4L290.0 165.0" fill="none" stroke="#22c55e" stroke-opacity=".5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="272"/>
<text class="m" x="36" y="170" font-size="15" fill="#f1f5f9">git commit -m "yangi sahifa"</text>
<rect class="tc1 cov" x="33" y="154" width="266.0" height="24" fill="#0a0d13"/>
<g class="tc1 cov"><rect class="cu1" x="36" y="156" width="8" height="18" fill="#22c55e" opacity=".9"/></g>
<text x="36" y="204" font-size="14" fill="#8b98a9" class="m ou1">1 ta commit yaratildi</text>
<path class="sc2" d="M34.0 239.0L47.0 241.4L60.0 236.6L73.0 241.4L86.0 236.6L99.0 241.4L112.0 236.6L125.0 241.4L138.0 236.6L151.0 241.4L164.0 236.6L177.0 241.4L190.0 236.6L203.0 241.4L218.0 239.0" fill="none" stroke="#22c55e" stroke-opacity=".5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="195"/>
<text class="m" x="36" y="244" font-size="15" fill="#f1f5f9">git push origin main</text>
<rect class="tc2 cov" x="33" y="228" width="194.0" height="24" fill="#0a0d13"/>
<g class="tc2 cov"><rect class="cu2" x="36" y="230" width="8" height="18" fill="#22c55e" opacity=".9"/></g>
<text x="36" y="278" font-size="14" fill="#34d399" class="m ou2">[OK] Sayt GitHub’ga yuklandi...</text></g>
<text class="m" x="36" y="322" font-size="15" font-weight="700" fill="#22c55e">$<tspan class="bk" font-weight="400"> _</tspan></text>
<rect x=".5" y=".5" width="759" height="345" rx="17.5" fill="none" stroke="#3b82f6" stroke-opacity=".6"/>
</svg>
